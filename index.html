<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KKday 依出發日找行程</title>
<style>
:root{--b:#26BEC9;--bd:#0E7C85;--bs:#E6F8FA;--ink:#1F2D33;--ink2:#5E6E73;--ink3:#8A989C;--line:#DDE6E8;--bg:#F4F8F9;--o:#FF5B2E;--os:#FFF1EC}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:#fff}
body{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,BlinkMacSystemFont,sans-serif;color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--b);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 28px}
.hero{background:linear-gradient(135deg,#26BEC9 0%,#3FCFC0 100%);border-radius:20px;padding:22px 18px 18px;margin-bottom:20px}
.hero h1{margin:0 0 14px;color:#fff;font-size:24px;font-weight:900;letter-spacing:.02em}

/* 搜尋卡 */
.box{background:#fff;border-radius:16px;box-shadow:0 8px 24px rgba(10,80,90,.12);position:relative}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:6px;padding:14px 16px 12px;font-size:15px;font-weight:700;color:var(--ink2);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button svg{width:20px;height:20px}
.tabs button[aria-selected="true"]{color:var(--bd);border-bottom-color:var(--b)}
.form{padding:16px;display:grid;grid-template-columns:1fr 1fr 1.3fr auto;gap:10px;align-items:stretch}
.fld{position:relative;text-align:left;border:1px solid var(--line);border-radius:12px;padding:9px 14px 10px;background:#fff;min-width:0;transition:border-color .15s}
.fld:hover,.fld[aria-expanded="true"]{border-color:var(--b)}
.fld .l{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:2px}
.fld .v{display:block;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fld .v.ph{color:var(--ink3);font-weight:400}
.go{background:var(--o);color:#fff;border-radius:12px;padding:0 26px;font-size:17px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:6px;min-height:58px}
.go:hover{background:#F04A1C}
.go svg{width:20px;height:20px}
.opt{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:0 16px 14px;font-size:13px;color:var(--ink2)}
.opt .t{font-weight:700}
.opt button{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;background:#fff}
.opt button[aria-pressed="true"]{border-color:var(--b);background:var(--bs);color:var(--bd);font-weight:700}

/* 下拉面板 */
.pop{position:absolute;left:16px;right:16px;top:calc(100% - 6px);z-index:20;background:#fff;border-radius:14px;box-shadow:0 12px 32px rgba(10,50,60,.22);padding:16px;display:none}
.pop.on{display:block}
.pop h3{margin:0 0 10px;font-size:14px;color:var(--ink2)}
.pop .close{position:absolute;right:10px;top:8px;width:32px;height:32px;border-radius:50%;font-size:20px;color:var(--ink3)}
.pop .close:hover{background:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.grid button{border:1px solid var(--line);border-radius:10px;padding:9px 12px;text-align:left;font-size:14px;display:flex;justify-content:space-between;gap:6px}
.grid button small{color:var(--ink3)}
.grid button:hover{border-color:var(--b)}
.grid button[aria-pressed="true"]{border-color:var(--b);background:var(--bs);color:var(--bd);font-weight:700}
.psearch{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;padding:0 12px;margin-bottom:12px;font-size:15px}
.hols{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:6px;border-bottom:1px solid var(--line);scrollbar-width:none}
.hols::-webkit-scrollbar{display:none}
.hols button{flex:0 0 auto;border:1px solid var(--line);border-radius:10px;padding:6px 12px;text-align:left;line-height:1.3}
.hols button b{display:block;font-size:13px}
.hols button small{font-size:11px;color:var(--ink3)}
.hols button[aria-pressed="true"]{border-color:var(--o);background:var(--os)}
.hols button[aria-pressed="true"] b{color:#C2410C}
.calhint{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:10px 0 8px;font-size:13px;color:var(--ink2)}
.calhint b{color:var(--o)}
.calhint .acts{display:flex;gap:8px}
.calhint .acts button{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px}
.calhint .acts button.pri{background:var(--b);border-color:var(--b);color:#fff;font-weight:700}
.cals{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.mhd{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;font-weight:700}
.mhd button{width:32px;height:32px;border-radius:50%;font-size:18px;color:var(--ink2)}
.mhd button:disabled{visibility:hidden}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.mg .w{font-size:12px;color:var(--ink3);padding:4px 0}
.mg .d{position:relative;height:44px;border-radius:8px;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.mg .d small{font-size:10px;color:var(--o);margin-top:2px}
.mg .d.na{color:#C5CED1;cursor:default}
.mg .d.h{font-weight:700}
.mg .d.h::after{content:"";position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:var(--o)}
.mg .d.in{background:var(--bs);border-radius:0}
.mg .d.se{background:var(--b);color:#fff;border-radius:8px}
.mg .d.se small{color:#fff}
.mg .d:not(.na):not(.se):hover{background:#EEF4F5}

/* 結果 */
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:6px 2px 12px}
.cnt{font-size:16px;font-weight:700}
.cnt b{color:var(--bd);font-size:20px}
.cnt span{font-weight:400;font-size:13px;color:var(--ink2);margin-left:6px}
.sort{display:flex;gap:4px;background:var(--bg);border-radius:999px;padding:3px}
.sort button{border-radius:999px;padding:5px 12px;font-size:13px;color:var(--ink2)}
.sort button[aria-pressed="true"]{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:#fff;padding:14px;text-decoration:none;color:inherit;transition:box-shadow .15s,transform .15s}
.card:hover{box-shadow:0 6px 20px rgba(17,60,70,.10);transform:translateY(-1px)}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--ink2);margin-bottom:6px}
.cat{font-weight:700;border-radius:4px;padding:1px 7px;background:var(--bs);color:var(--bd)}
.cat.c-機加酒{background:#FFF3D6;color:#7A5200}
.cat.c-郵輪{background:#ECEBFF;color:#3B3A8F}
.dot::before{content:"·";margin-right:6px;color:var(--ink3)}
.nm{margin:0 0 10px;font-weight:700;font-size:15px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.when{font-size:13px;color:var(--ink2);margin-bottom:10px}
.when b{color:var(--ink)}
.dates{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 10px}
.dates span{font-size:12px;background:var(--os);border-radius:6px;padding:3px 7px}
.dates span b{color:var(--o);margin-left:2px}
.ft{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:8px;padding-top:10px;border-top:1px dashed var(--line)}
.px{font-size:12px;color:var(--ink2)}
.px b{font-size:24px;font-weight:900;color:var(--o);margin:0 2px}
.cta{background:var(--b);color:#fff;border-radius:999px;padding:8px 16px;font-weight:700;font-size:14px}
.empty{grid-column:1/-1;text-align:center;color:var(--ink2);padding:36px 12px;background:var(--bg);border-radius:14px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
.empty button{margin-top:12px;border:1px solid var(--b);color:var(--bd);border-radius:999px;padding:7px 18px;font-weight:700;background:#fff}
.more{display:block;margin:16px auto 0;border:1px solid var(--b);color:var(--bd);background:#fff;border-radius:999px;padding:10px 28px;font-weight:700}
.note{font-size:12px;color:var(--ink3);margin:16px 0 0;text-align:center}
.skel{height:180px;border-radius:14px;background:linear-gradient(90deg,#F1F5F6 25%,#E8EEF0 50%,#F1F5F6 75%);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (max-width:760px){
  .form{grid-template-columns:1fr 1fr}
  .form .f-date{grid-column:1/-1}
  .form .go{grid-column:1/-1}
  .cals{grid-template-columns:1fr}
  .cals .m2{display:none}
  .pop{left:8px;right:8px}
}
@media (max-width:520px){
  .wrap{padding:12px 10px 24px}
  .hero{padding:16px 10px 10px;border-radius:16px;margin-bottom:16px}.hero h1{font-size:20px;margin-bottom:12px}
  .tabs button{flex:1 1 0;flex-direction:column;gap:2px;padding:10px 4px 8px;font-size:13px}
  .tabs button svg{width:22px;height:22px}
  .form{padding:12px;gap:8px}
  .fld{padding:8px 12px 9px}.fld .v{font-size:15px}
  .go{min-height:50px}
  .opt{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:0 12px 12px;gap:6px}
  .opt::-webkit-scrollbar{display:none}
  .opt .t,.opt button{flex:0 0 auto;white-space:nowrap}
  .pop{padding:14px 12px}
  .grid{grid-template-columns:1fr 1fr}
  .mg .d{height:42px;font-size:13px}.mg .d small{font-size:9px}
  .list{grid-template-columns:1fr}
  .bar{margin-bottom:10px}.sort button{padding:5px 10px}
}
/* 搜尋區固定、商品區上下滑 */
html,body{height:100%;overflow:hidden}
.wrap{height:100%;display:flex;flex-direction:column;padding-bottom:0}
.hero,.bar{flex:none}
.scr{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px 2px 20px;margin:0 -2px}
.sum{display:none;width:100%;align-items:center;gap:8px;padding:10px 14px;text-align:left;font-size:14px}
.sum svg{flex:none;width:18px;height:18px;color:var(--bd)}
.sum .s{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.sum .e{flex:none;color:var(--bd);font-weight:700;font-size:13px;border:1px solid var(--b);border-radius:999px;padding:3px 12px}
.mini .hero{padding-top:10px;padding-bottom:10px;margin-bottom:12px}
.mini .hero h1,.mini .form,.mini .opt{display:none}
.mini .sum{display:flex}
@media (max-width:768px){.pop{position:fixed;left:8px;right:8px;top:8px;bottom:auto;max-height:calc(100% - 16px);overflow-y:auto;overscroll-behavior:contain;z-index:50}}
/* 手機防止左右整塊晃動：只允許上下滑，橫向只留給「旅遊天數」「連假快選」兩排 */
html,body{overscroll-behavior:none;max-width:100%}
.wrap{overflow-x:hidden}
.hero,.bar,.scr,.pop{touch-action:pan-y}
.opt,.hols{touch-action:pan-x;overscroll-behavior-x:contain}
@media (max-width:520px){.tabs{overflow:hidden;touch-action:manipulation}}
/* 手機：預設收合搜尋、卡片精簡，一屏約兩個商品 */
@media (max-width:520px){
  .wrap{padding-top:8px}
  .mini .hero{padding:8px;margin-bottom:8px;border-radius:14px}
  .mini .tabs button{flex-direction:row;gap:4px;padding:8px 2px 7px;font-size:13px}
  .mini .tabs button svg{width:17px;height:17px}
  .sum{padding:9px 12px}
  .bar{flex-wrap:nowrap;margin:0 2px 8px}
  .cnt{font-size:14px;white-space:nowrap}.cnt b{font-size:17px}.cnt span{display:none}
  .sort{flex:none}.sort button{padding:4px 8px;font-size:12px}
  .list{gap:10px}
  .card{padding:12px}
  .meta{margin-bottom:4px}
  .nm{margin-bottom:6px;font-size:14px}
  .when{margin-bottom:6px;font-size:12px}
  .dates{margin:0 0 6px}
  .ft{padding-top:8px}
  .px b{font-size:20px}
  .cta{padding:6px 14px;font-size:13px}
}
/* 快速逛 + 圖片卡片（參考 OTA 手機版） */
.chips{flex:none;display:flex;gap:8px;align-items:center;overflow-x:auto;scrollbar-width:none;margin:0 0 10px;padding:2px;touch-action:pan-x;overscroll-behavior-x:contain}
.chips::-webkit-scrollbar{display:none}
.chips .t{flex:none;font-size:13px;font-weight:700;color:var(--ink2)}
.chips button{flex:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;background:#fff;white-space:nowrap}
.chips button small{margin-left:4px;font-size:11px;color:var(--ink3)}
.chips button.hl{border-color:#FFD2C2;background:var(--os);color:#C2410C;font-weight:700}
.chips button[aria-pressed="true"]{border-color:var(--b);background:var(--b);color:#fff}
.chips button[aria-pressed="true"] small{color:#fff}
.card{padding:0;overflow:hidden}
.pic{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,#BFEFF2,#E6F8FA);overflow:hidden}
.pic img{display:block;width:100%;height:100%;object-fit:cover}
.pic .cat{position:absolute;left:8px;top:8px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.pic.noimg.c-機加酒{background:linear-gradient(135deg,#FFE7A8,#FFF6DD)}
.pic.noimg.c-郵輪{background:linear-gradient(135deg,#D5D3FF,#F0EFFF)}
.pic .ic{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:rgba(14,124,133,.35)}
.bd{display:flex;flex-direction:column;flex:1;padding:12px 14px 14px}
.meta .cat{display:none}
.when2{display:none}
@media (max-width:520px){
  .chips{margin-bottom:8px}
  .list{grid-template-columns:1fr 1fr;gap:10px}
  .pic{aspect-ratio:3/2}
  .pic .cat{left:6px;top:6px;font-size:11px}
  .bd{padding:8px 10px 10px}
  .meta{font-size:11px;margin-bottom:2px}.meta .dot{display:none}
  .nm{font-size:13px;line-height:1.4;margin-bottom:4px}
  .when,.dates,.cta{display:none}
  .when2{display:block;font-size:11px;color:var(--ink2);margin-bottom:2px}.when2 b{color:var(--ink)}
  .ft{border-top:0;padding-top:2px}
  .px{font-size:11px}.px b{font-size:18px}
}
/* 翻頁：框內不捲動（電腦與手機都一樣，避免滑動卡在框裡） */
.wrap{height:auto}
.scr{overflow:visible;flex:none;padding-bottom:16px}
.more{display:none!important}
.pager{display:flex;align-items:center;justify-content:center;gap:12px;margin:16px 0 0}
.pager button{border:1px solid var(--b);color:var(--bd);background:#fff;border-radius:999px;padding:8px 20px;font-weight:700}
.pager button:disabled{border-color:var(--line);color:#C5CED1;cursor:default}
.pager span{font-size:13px;color:var(--ink2);min-width:90px;text-align:center}.pager span b{color:var(--ink)}
@media (min-width:521px){.list{grid-template-columns:repeat(3,1fr)}.nm{min-height:44px}.dates{max-height:25px;overflow:hidden}}
@media (min-width:769px){
  .mini .hero{padding:22px 18px 18px;margin-bottom:20px}
  .mini .hero h1,.mini .form,.mini .opt{display:revert}
  .mini .form{display:grid}.mini .opt{display:flex}
  .mini .sum{display:none}
  .list{grid-template-columns:repeat(3,1fr)}
  .nm{min-height:44px}
  .dates{max-height:25px;overflow:hidden}
}
@media (max-width:520px){
  /* 展開搜尋時變成「搜尋畫面」，按搜尋再回到結果 */
  body:not(.mini) .chips,body:not(.mini) .bar,body:not(.mini) .scr{display:none}
  .pic{aspect-ratio:auto;height:112px}
  .nm{min-height:36px;-webkit-line-clamp:2}
  .meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  .pager{margin-top:12px;gap:8px}.pager button{padding:8px 16px}
}
.pic .rec{position:absolute;right:8px;top:8px;background:rgba(255,91,46,.92);color:#fff;font-size:11px;font-weight:700;border-radius:4px;padding:1px 7px}
.rst{margin-left:6px;border:1px solid var(--b);color:var(--bd);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;background:#fff;vertical-align:middle}
@media (max-width:520px){.pic .rec{right:6px;top:6px;font-size:10px;padding:1px 5px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <h1>想什麼時候出發？</h1>
    <div class="box" id="box">
      <div class="tabs" id="tabs" role="tablist"></div>
      <button class="sum" id="sum"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span class="s" id="sumT"></span><span class="e">修改</span></button>
      <div class="form">
        <button class="fld f-from" id="fFrom" aria-expanded="false"><span class="l">出發地</span><span class="v" id="vFrom">不限</span></button>
        <button class="fld f-to" id="fTo" aria-expanded="false"><span class="l">目的地</span><span class="v ph" id="vTo">想去哪裡？</span></button>
        <button class="fld f-date" id="fDate" aria-expanded="false"><span class="l">出發日期</span><span class="v ph" id="vDate">選擇日期或連假</span></button>
        <button class="go" id="go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>搜尋</button>
      </div>
      <div class="opt" id="opt"><span class="t">旅遊天數</span></div>
      <div class="pop" id="pFrom"><button class="close" aria-label="關閉">×</button><h3>從哪裡出發？</h3><div class="grid" id="gFrom"></div></div>
      <div class="pop" id="pTo"><button class="close" aria-label="關閉">×</button><h3>想去哪裡？</h3><input class="psearch" id="qTo" type="search" placeholder="輸入國家、城市、航空公司或郵輪"><div class="grid" id="gTo"></div></div>
      <div class="pop" id="pDate"><button class="close" aria-label="關閉">×</button><h3>連假快選</h3><div class="hols" id="hols"></div>
        <div class="calhint"><span id="dHint"></span><span class="acts"><button id="dClr">不限日期</button><button class="pri" id="dOk">確定</button></span></div>
        <div class="cals"><div class="m1" id="m1"></div><div class="m2" id="m2"></div></div></div>
    </div>
  </section>

  <div class="chips" id="chips" aria-label="快速逛"></div>
  <div class="bar"><div class="cnt" id="cnt" aria-live="polite"></div>
    <div class="sort" id="sort" role="group" aria-label="排序"><button data-s="hot" aria-pressed="true">熱門</button><button data-s="price" aria-pressed="false">價格低→高</button><button data-s="soon" aria-pressed="false">最快出發</button></div></div>
  <div class="scr" id="scr">
  <div class="list" id="list"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
  <button class="more" id="more" style="display:none"></button>
  <div class="pager" id="pager"><button id="prev">‹ 上一頁</button><span id="pgi"></span><button id="next">下一頁 ›</button></div>
  <p class="note" id="note"></p>
  </div>
</div>
<script>
(function(){
  var HIDE=[546506]; // 不給消費者看的商品 ID（例：546506 旅展現場下單專用）
  var SRC='kk-avail.json',UTM='',PAGE=12,W=['日','一','二','三','四','五','六'];
  var $=function(id){return document.getElementById(id)};
